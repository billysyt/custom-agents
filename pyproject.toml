[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-agents"
version = "0.1.0"
description = "Durable self-hosted research and writing agents"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "deepagents==0.7.32", "langgraph-checkpoint-postgres==3.2.0",
  "langchain-openai==1.7.2", "fastapi==0.162.0", "uvicorn==0.54.0",
  "psycopg[binary,pool]==3.3.6", "httpx==0.28.1", "langfuse==5.0.4", "trafilatura==2.3.1",
]
[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]
[tool.setuptools.packages.find]
where = ["apps/server", "packages/core"]
[tool.setuptools.package-data]
custom_agents = ["static/*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
