image:
  repository: ghcr.io/billysyt/custom-agents
  tag: development
  digest: ''
existingSecret: custom-agents
# existingSecret must contain DATABASE_URL, LITELLM_API_KEY and AGENT_API_KEY.
config:
  LITELLM_URL: http://litellm.litellm.svc.cluster.local:4000/v1
  TEXT_MODEL: qwen3.6-35b-a3b-q4
  IMAGE_MODEL: moss-image
  EMBEDDING_MODEL: bge-m3
  LANGFUSE_BASE_URL: http://langfuse-web.langfuse.svc.cluster.local:3000
  LANGFUSE_TRACING_ENVIRONMENT: production
  PUBLIC_URL: http://localhost:8000/agents/news
  A2A_URL: http://custom-agents:8000/a2a
  TRUST_SSO: 'false'
resources:
  requests: {cpu: 25m, memory: 256Mi}
  limits: {memory: 1Gi}
storage:
  className: local-path-retain
  size: 5Gi
postgresql:
  image: pgvector/pgvector:0.8.2-pg17-trixie
  existingSecret: custom-agents-postgresql
  # Secret keys: username, password. Database name is agents.
  storage: 3Gi
  resources:
    requests: {cpu: 10m, memory: 96Mi}
    limits: {memory: 384Mi}
searxng:
  image: ghcr.io/searxng/searxng@sha256:7c7cbe509429e82755104b2a95f52085a98633c95d53f44e4e905fa3a59f08c8
  existingSecret: custom-agents-search
  # Secret key: secret-key
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 512Mi}
