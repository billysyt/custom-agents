apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: custom-agents-artifacts
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: custom-agents
spec:
  selector: {app: custom-agents}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-agents
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: custom-agents}
  template:
    metadata:
      labels: {app: custom-agents}
      annotations:
        checksum/config: {{ .Values.config | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      terminationGracePeriodSeconds: 30
      containers:
      - name: app
        image: {{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}
        ports: [{name: http, containerPort: 8000}]
        envFrom:
        - secretRef: {name: {{ .Values.existingSecret }}}
        env:
        - {name: DATA_DIR, value: /data}
        - {name: SKILLS_DIR, value: /app/agents/news/skills}
        - {name: SEARXNG_URL, value: 'http://custom-agents-search:8080'}
        {{- range $key, $value := .Values.config }}
        - {name: {{ $key }}, value: {{ $value | quote }}}
        {{- end }}
        resources: {{ .Values.resources | toJson }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        startupProbe:
          httpGet: {path: /health/ready, port: http}
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet: {path: /health/ready, port: http}
        livenessProbe:
          httpGet: {path: /health/live, port: http}
          initialDelaySeconds: 20
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: tmp, mountPath: /tmp}
        - {name: cache, mountPath: /home/agent/.cache}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: custom-agents-artifacts}
      - name: tmp
        emptyDir: {sizeLimit: 256Mi}
      - name: cache
        emptyDir: {sizeLimit: 128Mi}
