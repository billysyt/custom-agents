<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsroom · Custom Agents</title><link rel="stylesheet" href="static/style.css"><script src="static/app.js" defer></script></head>
<body><header><a href="./" class="brand">✳ Custom Agents</a><span>私人工作室</span><a href="https://langfuse.x-lab.hk">Langfuse ↗</a><a href="https://api.x-lab.hk/ui/">LiteLLM ↗</a></header>
<main><div class="intro"><p class="eyebrow">RESEARCH → WRITE → CREATE</p><h1>由好奇，寫成一篇新聞。</h1><p>搜尋可靠來源，用本地模型撰稿，再為故事生成封面。</p></div>
<div class="layout"><aside><section class="panel"><h2>新稿件</h2><form id="new-job"><label for="topic">想研究甚麼？</label><textarea id="topic" name="topic" required minlength="3" maxlength="1000">近期開源 AI／本地模型新聞</textarea><label for="language">語言與用語</label><input id="language" name="language" value="繁體中文（香港用語）" required maxlength="100"><label for="length">目標字數</label><input id="length" name="length" type="number" value="750" min="300" max="2000"><label class="check"><input type="checkbox" id="cover" checked> 生成封面示意圖</label><button type="submit">開始研究 <span>↗</span></button><p id="form-error" role="alert"></p></form></section><section class="history"><h2>最近稿件</h2><div id="jobs"></div></section></aside>
<article id="workspace" class="panel"><div id="empty"><span class="big-icon">✳</span><h2>下一個故事，由這裏開始。</h2><p>提交題材後，可以查看研究、撰稿、核實同封面嘅進度。</p><p class="muted">完成嘅稿件同來源會自動保存。</p></div><div id="job-view" hidden><div class="job-top"><span id="status" class="pill"></span><time id="created"></time></div><ol id="stages" aria-label="處理進度"></ol><p id="job-error" role="alert"></p><button id="retry" hidden>繼續處理</button><div id="result" hidden><div class="cover-wrap"><img id="cover-img" alt="AI 生成新聞封面示意圖"><span>AI 示意圖</span></div><h1 id="title"></h1><p class="draft-label">草稿 · 刊登前請核實內容</p><div id="body"></div><div id="downloads"></div><section class="sources"><h2>來源與延伸閱讀</h2><ol id="sources"></ol></section><details><summary>處理資料</summary><pre id="metadata"></pre></details></div><p id="progress-note"></p></div></article></div></main><footer>Custom Agents · 自架新聞研究工作室 <a href="https://github.com/billysyt/custom-agents">GitHub ↗</a></footer></body></html>
